<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Sticker | ElektraServ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e18;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            margin-bottom: 32px;
            text-align: center;
        }

        .controls h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .controls p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .print-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.3px;
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.4);
        }

        /* ===== STICKER ===== */
        .sticker {
            width: 420px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05),
                0 20px 60px rgba(0,0,0,0.5),
                0 0 120px rgba(255, 107, 53, 0.08);
            position: relative;
        }

        /* -- Top accent stripe -- */
        .sticker::before {
            content: '';
            display: block;
            height: 5px;
            background: linear-gradient(90deg, #ff6b35, #f7931e, #ff6b35);
        }

        /* -- Header -- */
        .sticker-header {
            background: linear-gradient(160deg, #1a1a2e 0%, #0f1a30 100%);
            padding: 28px 32px 24px;
            position: relative;
            overflow: hidden;
        }

        /* decorative circle */
        .sticker-header::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -40px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255,107,53,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.25rem;
            box-shadow: 0 4px 16px rgba(255,107,53,0.35);
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .logo-text span { color: #ff6b35; }

        .tagline {
            color: rgba(255,255,255,0.5);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            padding-left: 56px;
            position: relative;
            z-index: 1;
        }

        /* -- Body -- */
        .sticker-body {
            padding: 28px 32px;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        /* QR section */
        .qr-wrapper {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .qr-box {
            width: 148px;
            height: 148px;
            background: #fff;
            border: 2.5px solid #eaedf2;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
        }

        .qr-box canvas,
        .qr-box img {
            width: 100% !important;
            height: 100% !important;
            border-radius: 8px;
        }

        /* small bolt overlay in center of QR */
        .qr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            box-shadow: 0 2px 8px rgba(255,107,53,0.4);
        }

        .scan-text {
            font-size: 0.68rem;
            font-weight: 700;
            color: #ff6b35;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .scan-text i { font-size: 0.72rem; }

        /* Info section */
        .info-section {
            flex: 1;
            min-width: 0;
        }

        .person-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 11px;
        }

        .info-row:last-child { margin-bottom: 0; }

        .info-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .info-icon.phone {
            background: rgba(37, 211, 102, 0.1);
            color: #25d366;
        }

        .info-icon.whatsapp {
            background: rgba(37, 211, 102, 0.1);
            color: #25d366;
        }

        .info-icon.location {
            background: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
        }

        .info-icon.service {
            background: rgba(26, 26, 46, 0.08);
            color: #1a1a2e;
        }

        .info-text {
            font-size: 0.82rem;
            color: #444;
            font-weight: 500;
            line-height: 1.3;
        }

        .info-text strong {
            color: #1a1a2e;
            font-weight: 700;
            font-size: 0.88rem;
        }

        /* -- Footer -- */
        .sticker-footer {
            background: #f7f8fa;
            border-top: 1px solid #eaedf2;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-services {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .service-tag {
            background: #1a1a2e;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .footer-exp {
            font-size: 0.7rem;
            font-weight: 700;
            color: #ff6b35;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-exp i { font-size: 0.65rem; }

        /* ===== PRINT ===== */
        @media print {
            body {
                background: white;
                padding: 0;
                justify-content: flex-start;
                padding-top: 15mm;
            }

            .controls { display: none !important; }

            .sticker {
                box-shadow: none;
                border: 1.5px solid #ccc;
            }
        }

        @media (max-width: 480px) {
            .sticker { width: 100%; border-radius: 18px; }
            .sticker-header { padding: 22px 20px 18px; }
            .sticker-body { padding: 20px; gap: 16px; flex-direction: column; align-items: center; }
            .info-section { width: 100%; }
            .sticker-footer { padding: 12px 20px; }
            .tagline { padding-left: 0; margin-top: 8px; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h1>ElektraServ - QR Sticker</h1>
        <p>QR kodu okutarak iletisim sayfasina ulasabilirsiniz</p>
        <button class="print-btn" onclick="window.print()">
            <i class="fas fa-print"></i>
            Yazdir
        </button>
    </div>

    <div class="sticker">
        <!-- Header -->
        <div class="sticker-header">
            <div class="logo-row">
                <div class="logo-icon"><i class="fas fa-bolt"></i></div>
                <div class="logo-text">Elektra<span>Serv</span></div>
            </div>
            <div class="tagline">Elektrik Makine Bakim & Onarim</div>
        </div>

        <!-- Body -->
        <div class="sticker-body">
            <div class="qr-wrapper">
                <div class="qr-box">
                    <div id="qrcode"></div>
                    <div class="qr-overlay"><i class="fas fa-bolt"></i></div>
                </div>
                <div class="scan-text">
                    <i class="fas fa-camera"></i> QR Kodu Okutun
                </div>
            </div>

            <div class="info-section">
                <div class="person-name">Ulas Ilgar</div>

                <div class="info-row">
                    <div class="info-icon phone">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <div class="info-text"><strong>+90 (533) 030 03 83</strong></div>
                </div>

                <div class="info-row">
                    <div class="info-icon whatsapp">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <div class="info-text">WhatsApp ile Ulasin</div>
                </div>

                <div class="info-row">
                    <div class="info-icon location">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="info-text">Kars ve Cevre Iller</div>
                </div>

                <div class="info-row">
                    <div class="info-icon service">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="info-text">7/24 Acil Servis</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="sticker-footer">
            <div class="footer-services">
                <span class="service-tag">Motor</span>
                <span class="service-tag">Jenerator</span>
                <span class="service-tag">Trafo</span>
                <span class="service-tag">Pano</span>
            </div>
            <div class="footer-exp">
                <i class="fas fa-shield-alt"></i>
                15+ Yil Tecrube
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById('qrcode'), {
            text: 'https://elektrik-bakim-site.vercel.app/iletisim.html',
            width: 256,
            height: 256,
            colorDark: '#1a1a2e',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
